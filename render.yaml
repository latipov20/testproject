# Render Blueprint: PostgreSQL + API (NestJS) + do'kon (Next.js).
# Render dashboard → New → Blueprint → shu repo. Region: Frankfurt (O'zbekistonga eng yaqini).
#
# Bepul (free) tarif cheklovlari:
#  - 15 daqiqa so'rov bo'lmasa servis uxlaydi, birinchi so'rov ~1 daqiqa kutadi.
#    API uxlaganda Telegram bot ham to'xtaydi (long polling).
#  - Disk vaqtinchalik: admin yuklagan rasmlar har deploy/qayta ishga tushishda o'chadi
#    (demo rasmlar har startda qayta chiziladi).
#  - Bepul PostgreSQL 30 kundan keyin o'chadi.
# Haqiqiy do'kon uchun: API va web'ni `plan: starter`, bazani `plan: basic-256mb` qiling
# va API'ga disk ulang (pastdagi `disk` bo'limi).

databases:
  - name: vet-products-db
    plan: free
    region: frankfurt
    databaseName: vet_products
    user: vet
    postgresMajorVersion: "16"

services:
  - type: web
    name: vet-products-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm i -g pnpm@10.28.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter api exec prisma generate && pnpm --filter api build
    # Seed'lar upsert bilan yozilgan, qayta ishga tushirish xavfsiz.
    startCommand: cd apps/api && npx prisma migrate deploy && npx ts-node prisma/seed.ts && npx ts-node prisma/demo-catalog.ts && node dist/main.js
    healthCheckPath: /docs
    # disk:                     # faqat pullik tarifda
    #   name: uploads
    #   mountPath: /opt/render/project/src/apps/api/uploads
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vet-products-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://vet-products-web.onrender.com,https://latipov.org.uz
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_CHECKOUT_URL
        value: https://checkout.paycom.uz
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

  - type: web
    name: vet-products-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm i -g pnpm@10.28.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter web build
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render API'ga boshqa nom bersa (masalan ...-api-x1y2), shu ikkalasini yangilab qayta deploy qiling.
      - key: API_URL
        value: https://vet-products-api.onrender.com/v1
      - key: NEXT_PUBLIC_API_URL
        value: https://vet-products-api.onrender.com/v1
